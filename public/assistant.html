<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!-- CAPLYNK:BODY-START -->
<title>CapLynk Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a two-pane workspace. Conversations rail on the left, the chat in the middle, composer pinned to the bottom. Stacks on phones. */
:root {
  --bg: #f3f5f7;
  --panel: #ffffff;
  --rail: #e8ecef;
  --ink: #15202b;
  --muted: #5b6875;
  --line: #d5dce2;
  --accent: #0b7a75;
  --accent-ink: #ffffff;
  --accent-soft: #d8efed;
  --user-bubble: #15202b;
  --user-ink: #f3f5f7;
  --ok: #1f8a4c;
  --warn: #b26b00;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1519; --panel: #151d22; --rail: #11181c; --ink: #e6ecef; --muted: #93a1ab;
    --line: #26323a; --accent: #3cc2b8; --accent-ink: #062523; --accent-soft: #123532;
    --user-bubble: #2a3a44; --user-ink: #eef3f5; --ok: #4cc27f; --warn: #e2a33c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1519; --panel: #151d22; --rail: #11181c; --ink: #e6ecef; --muted: #93a1ab;
  --line: #26323a; --accent: #3cc2b8; --accent-ink: #062523; --accent-soft: #123532;
  --user-bubble: #2a3a44; --user-ink: #eef3f5; --ok: #4cc27f; --warn: #e2a33c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font-body);
}
button, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100%; }

/* Rail */
.rail {
  background: var(--rail); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 16px; min-height: 0;
  padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font: 700 22px/1 var(--font-display); letter-spacing: -0.01em; }
.new-chat {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius);
  padding: 9px 12px; cursor: pointer; font-weight: 600;
}
.new-chat:hover { border-color: var(--accent); }
.rail-label { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.chats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; min-height: 0; }
.chats button {
  width: 100%; text-align: left; background: none; border: 0; border-radius: 8px;
  padding: 8px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted);
}
.chats button:hover { background: var(--panel); color: var(--ink); }
.chats button[aria-current="true"] { background: var(--panel); color: var(--ink); font-weight: 600; }
.links { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 14px; }
.link-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
.link-row span:first-child { color: var(--muted); }
.pill { font: 500 11px/1 var(--font-mono); padding: 4px 7px; border-radius: 99px; border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: currentColor; }
.pill.warn { color: var(--warn); border-color: currentColor; }
.account { display: flex; align-items: center; gap: 10px; }
.account button { flex: 1; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 8px 10px; cursor: pointer; font-weight: 600; }
.account button:disabled { opacity: 0.55; cursor: default; }

/* Main */
.main { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); }
.topbar {
  display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line);
  padding-block: 12px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; cursor: pointer; }
.topbar h1 { font: 600 16px/1.2 var(--font-body); margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model { font: 500 12px/1 var(--font-mono); color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--ok); }

.scroll { flex: 1; overflow-y: auto; min-height: 0; }
.thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; padding-block: 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.welcome { display: flex; flex-direction: column; gap: 14px; padding-top: 4vh; }
.welcome h2 { font: 700 clamp(28px, 5vw, 40px)/1.1 var(--font-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.welcome p { margin: 0; color: var(--muted); max-width: 60ch; }
.starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 8px; }
.starter {
  text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 4px;
}
.starter:hover { border-color: var(--accent); }
.starter b { font-weight: 600; }
.starter span { color: var(--muted); font-size: 13px; }

.msg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.msg .who { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.msg.user { align-items: flex-end; }
.msg.user .body { background: var(--user-bubble); color: var(--user-ink); padding: 10px 14px; border-radius: 14px 14px 4px 14px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.assistant .body { overflow-wrap: anywhere; min-width: 0; }
.msg.assistant .body > *:first-child { margin-top: 0; }
.msg.assistant .body > *:last-child { margin-bottom: 0; }
.body p, .body ul, .body ol { margin: 0 0 10px; }
.body pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font: 13px/1.5 var(--font-mono); margin: 0 0 10px; }
.body code { font: 0.9em var(--font-mono); background: var(--bg); padding: 1px 5px; border-radius: 4px; }
.body pre code { background: none; padding: 0; }
.thinking { color: var(--muted); font-style: italic; }
.note { font-size: 13px; color: var(--warn); }

.composer-wrap { border-top: 1px solid var(--line); padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); }
.composer { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 14px; background: var(--bg); }
.composer:focus-within { border-color: var(--accent); }
.composer textarea { flex: 1; min-width: 0; border: 0; background: none; resize: none; outline: none; max-height: 180px; padding: 6px 0; }
.send {
  border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 700;
  background: var(--accent); color: var(--accent-ink);
}
.send:disabled { opacity: 0.45; cursor: default; }
.hint { max-width: 760px; margin: 8px auto 0; font-size: 12px; color: var(--muted); }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset: 0 auto 0 0; width: min(86vw, 300px); z-index: 20; transform: translateX(-102%); transition: transform 0.2s ease; padding-top: max(18px, env(safe-area-inset-top, 0px)); }
  .rail.open { transform: none; box-shadow: 0 0 0 100vmax rgb(0 0 0 / 0.35); }
  .menu-btn { display: inline-block; }
  .topbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .model .label { display: none; }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }
</style>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="9" width="17" height="14" rx="7" fill="none" stroke="var(--accent)" stroke-width="3"></rect>
        <rect x="13" y="9" width="17" height="14" rx="7" fill="none" stroke="var(--ink)" stroke-width="3"></rect>
      </svg>
      <span class="brand-name">CapLynk</span>
    </div>
    <button class="new-chat" id="newChat" type="button">+ New conversation</button>
    <div class="rail-label">Conversations</div>
    <ul class="chats" id="chatList"></ul>
    <div class="links">
      <div class="link-row"><span>Source</span><span class="pill ok">GitHub · CapLynk</span></div>
      <div class="link-row"><span>Data</span><span class="pill" id="fbPill">Firebase · checking</span></div>
      <div class="link-row"><span>LLM</span><span class="pill" id="llmPill">Claude · checking</span></div>
    </div>
    <div class="account">
      <button type="button" id="authBtn" disabled>Sign in with Google</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Show conversations">☰</button>
      <h1 id="chatTitle">New conversation</h1>
      <div class="model"><span class="dot" id="liveDot"></span><span class="label" id="modelLabel">Claude</span></div>
    </header>
    <div class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>
    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Message CapLynk…" aria-label="Message"></textarea>
        <button class="send" id="sendBtn" type="submit" disabled>Send</button>
      </form>
      <div class="hint" id="hint">Enter to send, Shift+Enter for a new line.</div>
    </div>
  </main>
</div>

<script src="firebase-config.js"></script>
<script>
/* Firebase config is shared by every page: see firebase-config.js */
const FIREBASE_CONFIG = window.CAPLYNK_FIREBASE || { apiKey: "" };
const CHAT_ENDPOINT = "/api/chat";           // Firebase Hosting rewrites this to the `chat` Cloud Function
const FIREBASE_SDK = window.CAPLYNK_FIREBASE_SDK || "https://www.gstatic.com/firebasejs/10.12.2";

const SYSTEM_RULES =
  "You are the assistant inside CapLynk, a web app that is in early development. " +
  "Be concise and practical. Use Markdown for lists and code.";

const STARTERS = [
  { title: "Shape the product", text: "Help me define what CapLynk should do. Ask me 5 sharp questions about users, problem and first feature." },
  { title: "Design the data", text: "Propose a Firestore data model for a chat app with users, conversations and messages, with security rules." },
  { title: "Name the value", text: "Write 5 one-line taglines for CapLynk, a product that links people to the right capability using AI." }
];

/* ---------- State ---------- */
const $ = (id) => document.getElementById(id);
const state = { chats: [], currentId: null, busy: false, user: null, backend: null, db: null, fs: null };
const store = {
  load() { try { return JSON.parse(localStorage.getItem("caplynk.chats") || "[]"); } catch { return []; } },
  save() { try { localStorage.setItem("caplynk.chats", JSON.stringify(state.chats.slice(0, 50))); } catch {} }
};
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const current = () => state.chats.find((c) => c.id === state.currentId);

/* ---------- Minimal Markdown ---------- */
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}
function md(src) {
  const out = []; const lines = src.split("\n"); let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.startsWith("```")) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++; out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { out.push("<p><strong>" + inline(h[2]) + "</strong></p>"); i++; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line); const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      out.push((ordered ? "<ol>" : "<ul>") + items.map((t) => "<li>" + inline(t) + "</li>").join("") + (ordered ? "</ol>" : "</ul>")); continue;
    }
    if (!line.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !lines[i].startsWith("```") && !/^\s*([-*]|\d+\.)\s+/.test(lines[i]) && !/^#{1,4}\s/.test(lines[i])) para.push(lines[i++]);
    out.push("<p>" + para.map(inline).join("<br>") + "</p>");
  }
  return out.join("");
}

/* ---------- Rendering ---------- */
function renderList() {
  const ul = $("chatList"); ul.textContent = "";
  for (const c of state.chats) {
    const li = document.createElement("li"); const b = document.createElement("button");
    b.type = "button"; b.textContent = c.title || "New conversation";
    b.setAttribute("aria-current", String(c.id === state.currentId));
    b.onclick = () => { state.currentId = c.id; render(); $("rail").classList.remove("open"); };
    li.append(b); ul.append(li);
  }
}
function msgEl(role, text) {
  const wrap = document.createElement("div"); wrap.className = "msg " + role;
  const who = document.createElement("div"); who.className = "who"; who.textContent = role === "user" ? "You" : "CapLynk";
  const body = document.createElement("div"); body.className = "body";
  if (role === "user") body.textContent = text; else body.innerHTML = md(text);
  wrap.append(who, body); return wrap;
}
function renderThread() {
  const t = $("thread"); t.textContent = "";
  const c = current();
  $("chatTitle").textContent = c?.title || "New conversation";
  if (!c || !c.messages.length) {
    const w = document.createElement("section"); w.className = "welcome";
    w.innerHTML = '<h2>What should we build into CapLynk today?</h2><p>This is the first CapLynk workspace: a chat that talks to Claude, saves conversations to Firebase, and ships from GitHub. Try one of these to start.</p>';
    const grid = document.createElement("div"); grid.className = "starters";
    for (const s of STARTERS) {
      const b = document.createElement("button"); b.type = "button"; b.className = "starter";
      const bt = document.createElement("b"); bt.textContent = s.title;
      const sp = document.createElement("span"); sp.textContent = s.text;
      b.append(bt, sp); b.onclick = () => send(s.text); grid.append(b);
    }
    w.append(grid); t.append(w); return;
  }
  for (const m of c.messages) t.append(msgEl(m.role, m.content));
  $("scroll").scrollTop = $("scroll").scrollHeight;
}
function render() { renderList(); renderThread(); updateSend(); }
function updateSend() { $("sendBtn").disabled = state.busy || !$("input").value.trim() || !state.backend; }

/* ---------- Backends ---------- */
// 1) Inside a Claude Artifact preview: talk to Claude through the viewer's own account.
async function artifactBackend() {
  const sample = await window.claude.use("sample");
  if (!sample) return null;
  return {
    label: "Claude (preview)",
    async chat(messages, onText, signal) {
      const turns = [{ role: "user", content: SYSTEM_RULES }, ...messages.slice(-20)];
      const r = await sample(turns, { cache: false, signal, onText: ({ text }) => onText(text) });
      return r.text;
    }
  };
}
// 2) Deployed on Firebase Hosting: POST to the Cloud Function, which holds the API key.
function functionBackend() {
  return {
    label: "Claude via Cloud Function",
    async chat(messages, onText, signal) {
      const headers = { "Content-Type": "application/json" };
      if (state.user) headers.Authorization = "Bearer " + (await state.user.getIdToken());
      const res = await fetch(CHAT_ENDPOINT, { method: "POST", headers, body: JSON.stringify({ messages: messages.slice(-20) }), signal });
      if (!res.ok) throw { code: "http_" + res.status, message: (await res.text()) || res.statusText };
      const reader = res.body.getReader(); const dec = new TextDecoder(); let text = "";
      for (;;) { const { done, value } = await reader.read(); if (done) break; text += dec.decode(value, { stream: true }); onText(text); }
      return text;
    }
  };
}

/* ---------- Firebase (Auth + Firestore) ---------- */
async function initFirebase() {
  if (!FIREBASE_CONFIG.apiKey) { setPill("fbPill", "Firebase · add config", "warn"); return; }
  try {
    const [{ initializeApp }, auth, fs] = await Promise.all([
      import(FIREBASE_SDK + "/firebase-app.js"),
      import(FIREBASE_SDK + "/firebase-auth.js"),
      import(FIREBASE_SDK + "/firebase-firestore.js")
    ]);
    const app = initializeApp(FIREBASE_CONFIG);
    const a = auth.getAuth(app); state.db = fs.getFirestore(app); state.fs = fs;
    const btn = $("authBtn"); btn.disabled = false;
    btn.onclick = () => state.user ? auth.signOut(a) : auth.signInWithPopup(a, new auth.GoogleAuthProvider());
    auth.onAuthStateChanged(a, async (u) => {
      state.user = u;
      btn.textContent = u ? "Sign out " + (u.displayName || "") : "Sign in with Google";
      setPill("fbPill", u ? "Firebase · synced" : "Firebase · signed out", u ? "ok" : "warn");
      if (u) await loadRemoteChats();
    });
  } catch (e) {
    console.error(e); setPill("fbPill", "Firebase · failed to load", "warn");
  }
}
async function loadRemoteChats() {
  const { collection, getDocs, query, orderBy, limit } = state.fs;
  const snap = await getDocs(query(collection(state.db, "users", state.user.uid, "chats"), orderBy("updatedAt", "desc"), limit(50)));
  const remote = snap.docs.map((d) => d.data());
  const ids = new Set(remote.map((c) => c.id));
  state.chats = [...remote, ...state.chats.filter((c) => !ids.has(c.id))];
  render();
}
async function saveRemote(chat) {
  if (!state.user || !state.db) return;
  const { doc, setDoc } = state.fs;
  try { await setDoc(doc(state.db, "users", state.user.uid, "chats", chat.id), chat); } catch (e) { console.error("Save failed", e); }
}

/* ---------- Sending ---------- */
let ctl = null;
async function send(text) {
  text = text.trim(); if (!text || state.busy || !state.backend) return;
  let c = current();
  if (!c) { c = { id: uid(), title: "", messages: [], updatedAt: Date.now() }; state.chats.unshift(c); state.currentId = c.id; }
  if (!c.title) c.title = text.slice(0, 48);
  c.messages.push({ role: "user", content: text });
  $("input").value = ""; autosize();
  state.busy = true; render();

  const el = msgEl("assistant", ""); const body = el.querySelector(".body");
  body.innerHTML = '<span class="thinking">Thinking…</span>';
  $("thread").append(el); $("scroll").scrollTop = $("scroll").scrollHeight;
  ctl = new AbortController();
  try {
    const reply = await state.backend.chat(c.messages, (t) => { body.innerHTML = md(t); $("scroll").scrollTop = $("scroll").scrollHeight; }, ctl.signal);
    c.messages.push({ role: "assistant", content: reply });
  } catch (e) {
    const partial = e?.text;
    if (partial) c.messages.push({ role: "assistant", content: partial });
    const p = document.createElement("p"); p.className = "note"; p.textContent = errorCopy(e);
    body.innerHTML = partial ? md(partial) : ""; body.append(p);
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") { state.backend = null; setPill("llmPill", "Claude · not allowed", "warn"); }
  } finally {
    c.updatedAt = Date.now(); state.busy = false; store.save(); saveRemote(c); renderList(); updateSend();
  }
}
function errorCopy(e) {
  switch (e?.code) {
    case "cancelled": return "Stopped.";
    case "not_granted": return "Claude isn't allowed on this page. Allow it from the page's permissions to chat.";
    case "rate_limited": return "Too many messages right now. Wait a moment and send again.";
    case "http_401": return "Sign in with Google to chat.";
    case "http_404": return "The chat function isn't deployed yet. Run firebase deploy, or start the emulators.";
    default: return "Claude didn't answer. Check your connection and send again.";
  }
}

/* ---------- Wiring ---------- */
function setPill(id, text, kind) { const p = $(id); p.textContent = text; p.className = "pill" + (kind ? " " + kind : ""); }
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 180) + "px"; }
$("input").addEventListener("input", () => { autosize(); updateSend(); });
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("input").value); } });
$("composer").addEventListener("submit", (e) => { e.preventDefault(); send($("input").value); });
$("newChat").onclick = () => { state.currentId = null; render(); $("rail").classList.remove("open"); $("input").focus(); };
$("menuBtn").onclick = () => $("rail").classList.toggle("open");
$("rail").addEventListener("click", (e) => { if (e.target === $("rail")) $("rail").classList.remove("open"); });

async function boot() {
  state.chats = store.load(); state.currentId = state.chats[0]?.id ?? null; render();
  if (window.claude) {
    // Artifact preview: no Firebase; Claude answers on the viewer's account.
    setPill("fbPill", "Firebase · after deploy", "warn");
    $("authBtn").textContent = "Sign-in works after deploy";
    state.backend = await artifactBackend();
  } else {
    initFirebase();
    state.backend = functionBackend();
  }
  if (state.backend) {
    setPill("llmPill", "Claude · ready", "ok"); $("modelLabel").textContent = state.backend.label; $("liveDot").classList.add("live");
  } else {
    setPill("llmPill", "Claude · unavailable", "warn"); $("hint").textContent = "Claude isn't available in this view.";
  }
  updateSend();
}
boot();
</script>
